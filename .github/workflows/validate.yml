name: Company OS validation
on:
  push:
    branches: [main, "codex/complete-company-os"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
      - name: Validate source contracts
        run: npm run validate
      - name: Offline regression and denial tests
        run: npm test
      - name: Preview without credentials
        run: npm run preview
